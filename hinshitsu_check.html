<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>品質チェックシート記録</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f0f2f5;color:#222;font-size:15px}
header{background:#1a3a5c;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
header h1{font-size:16px;font-weight:700}
.tab-bar{display:flex;background:#fff;border-bottom:2px solid #e0e0e0;position:sticky;top:48px;z-index:99}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:13px;cursor:pointer;color:#888;border-bottom:3px solid transparent;transition:.2s}
.tab.active{color:#1a3a5c;border-bottom-color:#1a3a5c;font-weight:700}
.page{display:none;padding:12px}
.page.active{display:block}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card h3{font-size:13px;color:#666;margin-bottom:10px;font-weight:600}
label{display:block;font-size:13px;color:#555;margin-bottom:4px;font-weight:500}
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%;padding:10px 12px;border:1.5px solid #d0d0d0;border-radius:8px;
  font-size:15px;outline:none;background:#fafafa;transition:.2s}
input:focus,textarea:focus{border-color:#1a3a5c;background:#fff}
textarea{resize:vertical;min-height:60px}
.form-row{margin-bottom:12px}

/* 品番検索 */
#part-search-wrap{position:relative}
#suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid #1a3a5c;
  border-top:none;border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;z-index:200;display:none}
.sug-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0;display:flex;gap:8px;align-items:center}
.sug-item:hover,.sug-item:active{background:#e8f0f8}
.sug-no{font-weight:700;font-size:14px;color:#1a3a5c;min-width:80px}
.sug-nm{font-size:13px;color:#555}
.sel-box{background:#e8f4e8;border:1.5px solid #4caf50;border-radius:8px;padding:10px 12px;margin-top:6px;display:none}
.sel-box .no{font-weight:700;font-size:15px;color:#1a3a5c}
.sel-box .nm{font-size:13px;color:#555}

/* 実績区分 */
.toggle-group{display:flex;gap:0;border:1.5px solid #d0d0d0;border-radius:8px;overflow:hidden}
.toggle-btn{flex:1;padding:10px 4px;text-align:center;font-size:13px;cursor:pointer;
  background:#f5f5f5;color:#666;border:none;transition:.15s;font-weight:500}
.toggle-btn.active{background:#1a3a5c;color:#fff;font-weight:700}
.toggle-btn.active.kanno{background:#4caf50}
.toggle-btn.active.bunno{background:#ff9800}
.toggle-btn.active.chuukan{background:#2196f3}

/* 材料残 */
.bool-group{display:flex;gap:0;border:1.5px solid #d0d0d0;border-radius:8px;overflow:hidden}
.bool-btn{flex:1;padding:10px;text-align:center;font-size:14px;cursor:pointer;
  background:#f5f5f5;color:#666;border:none;transition:.15s;font-weight:500}
.bool-btn.active-y{background:#4caf50;color:#fff;font-weight:700}
.bool-btn.active-n{background:#9e9e9e;color:#fff;font-weight:700}

/* 写真エリア */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.photo-thumb{position:relative;aspect-ratio:3/4;background:#f0f0f0;border-radius:8px;overflow:hidden;border:1.5px solid #ddd}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-del{position:absolute;top:4px;right:4px;width:24px;height:24px;background:rgba(220,50,50,.9);
  color:#fff;border-radius:50%;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.photo-add{aspect-ratio:3/4;background:#f8f8f8;border:2px dashed #bbb;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#999;font-size:12px;gap:4px}
.photo-add span{font-size:28px}
.photo-info{font-size:12px;color:#888;margin-bottom:8px}
#photo-input{display:none}

/* 保存ボタン */
.btn-submit{width:100%;padding:14px;background:#1a3a5c;color:#fff;border:none;border-radius:10px;
  font-size:16px;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-submit:disabled{background:#aaa;cursor:not-allowed}
.btn-submit:active:not(:disabled){background:#0d2540}

/* 成功画面 */
#success-screen{display:none;text-align:center;padding:40px 20px}
.success-icon{font-size:64px;margin-bottom:16px}
.success-msg{font-size:18px;font-weight:700;color:#4caf50;margin-bottom:8px}
.success-sub{font-size:13px;color:#888;margin-bottom:24px}
.btn-reset{padding:12px 32px;background:#1a3a5c;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}

/* 記録一覧 */
.record-item{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rec-no{font-weight:700;color:#1a3a5c;font-size:14px}
.rec-date{font-size:12px;color:#888}
.rec-name{font-size:13px;color:#555;margin-bottom:4px}
.rec-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.tag-kanno{background:#e8f5e9;color:#388e3c}
.tag-bunno{background:#fff3e0;color:#f57c00}
.tag-chuukan{background:#e3f2fd;color:#1565c0}
.tag-zairyo{background:#fce4ec;color:#c62828}
.rec-photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rec-photo-link{padding:3px 10px;background:#e8f0f8;color:#1a3a5c;border-radius:6px;font-size:12px;text-decoration:none;font-weight:600}
.loading{text-align:center;padding:20px;color:#888;font-size:14px}
.btn-refresh{padding:8px 20px;background:#1a3a5c;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:12px}

/* ガス設定 */
.gas-status{font-size:12px;padding:6px 10px;border-radius:6px;margin-top:6px}
.gas-ok{background:#e8f5e9;color:#388e3c}
.gas-ng{background:#ffebee;color:#c62828}
</style>
</head>
<body>

<header>
  <span style="font-size:22px">📋</span>
  <h1>品質チェックシート記録</h1>
</header>

<div class="tab-bar">
  <div class="tab active" onclick="showTab('tab-input')">📝 入力</div>
  <div class="tab" onclick="showTab('tab-list');loadList()">📋 記録一覧</div>
  <div class="tab" onclick="showTab('tab-cfg')">⚙ 設定</div>
</div>

<!-- ========== 入力タブ ========== -->
<div id="tab-input" class="page active">
<div id="form-screen">

  <!-- 部品番号 -->
  <div class="card">
    <h3>🔍 部品番号</h3>
    <div class="form-row">
      <div id="part-search-wrap">
        <input type="text" id="part-search" placeholder="品番または品名で検索..." autocomplete="off" oninput="searchPart(this.value)">
        <div id="suggestions"></div>
      </div>
      <div class="sel-box" id="sel-box">
        <div class="no" id="sel-no"></div>
        <div class="nm" id="sel-nm"></div>
      </div>
    </div>
  </div>

  <!-- 基本情報 -->
  <div class="card">
    <h3>📅 基本情報</h3>
    <div class="form-row">
      <label>生産日</label>
      <input type="date" id="prod-date">
    </div>
    <div class="form-row">
      <label>作業者</label>
      <input type="text" id="operator" placeholder="氏名">
    </div>
  </div>

  <!-- 生産実績 -->
  <div class="card">
    <h3>📊 生産実績</h3>
    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div>
        <label>生産数</label>
        <input type="number" id="prod-count" min="0" placeholder="0">
      </div>
      <div>
        <label>不良数</label>
        <input type="number" id="ng-count" min="0" placeholder="0">
      </div>
    </div>
    <div class="form-row">
      <label>実績区分</label>
      <div class="toggle-group">
        <button class="toggle-btn kanno active" id="btn-kanno" onclick="setKanno('完納')">✅ 完納（完成）</button>
        <button class="toggle-btn bunno" id="btn-bunno" onclick="setKanno('分納')">📦 分納</button>
        <button class="toggle-btn chuukan" id="btn-chuukan" onclick="setKanno('中間実績')">🔄 中間実績</button>
      </div>
    </div>
    <div class="form-row">
      <label>材料残</label>
      <div class="bool-group">
        <button class="bool-btn active-y" id="btn-zairyo-y" onclick="setZairyo(true)">あり</button>
        <button class="bool-btn" id="btn-zairyo-n" onclick="setZairyo(false)">なし</button>
      </div>
    </div>
  </div>

  <!-- メモ -->
  <div class="card">
    <h3>📝 メモ（任意）</h3>
    <div class="form-row">
      <textarea id="memo" placeholder="不良内容・特記事項など"></textarea>
    </div>
  </div>

  <!-- 写真 -->
  <div class="card">
    <h3>📸 チェックシート写真（複数枚可・自動圧縮）</h3>
    <div class="photo-info" id="photo-info"></div>
    <div class="photo-grid" id="photo-grid">
      <div class="photo-add" onclick="document.getElementById('photo-input').click()">
        <span>📷</span>
        <span>写真を追加<br>（2/5枚）</span>
      </div>
    </div>
    <input type="file" id="photo-input" accept="image/*" multiple capture="environment" onchange="addPhotos(this)">
  </div>

  <!-- 保存 -->
  <button class="btn-submit" id="submit-btn" onclick="submitForm()">
    📤 記録を保存する
  </button>
  <div style="height:20px"></div>

</div><!-- /form-screen -->

<!-- 成功画面 -->
<div id="success-screen">
  <div class="success-icon">✅</div>
  <div class="success-msg">保存完了しました</div>
  <div class="success-sub" id="success-msg"></div>
  <button class="btn-reset" onclick="resetForm()">続けて入力する</button>
</div>
</div><!-- /tab-input -->

<!-- ========== 記録一覧タブ ========== -->
<div id="tab-list" class="page">
  <div style="padding:12px">
    <button class="btn-refresh" onclick="loadList()">🔄 最新を取得</button>
    <div id="list-area"><div class="loading">読み込み中...</div></div>
  </div>
</div>

<!-- ========== 設定タブ ========== -->
<div id="tab-cfg" class="page">
  <div style="padding:12px">
    <div class="card">
      <h3>⚙ GAS URL 設定</h3>
      <div class="form-row">
        <label>GAS ウェブアプリURL</label>
        <input type="text" id="cfg-gas-url" placeholder="https://script.google.com/macros/s/...">
        <div class="gas-status" id="gas-status"></div>
      </div>
      <button onclick="saveCfg()" style="padding:10px 24px;background:#1a3a5c;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:8px">保存して接続</button>
    </div>
    <div class="card">
      <h3>ℹ 現在の設定</h3>
      <div id="cfg-info" style="font-size:13px;color:#555;line-height:1.8"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
// GAS URL（直接埋め込み）- ここを更新してください
// ============================================================
const GAS_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbw3zssfr-pWlRcgMT4fhQ40HoOUeJHz7-_yYIcA0b4hxh2BXdWAPe96D2kXPizLzsqI/exec';
const CFG_KEY = 'hk_hinshitsu_cfg';

let gasUrl = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
    const u = s.gasUrl || '';
    return (u.length > 50 && u.startsWith('https://script.google.com')) ? u : GAS_URL_DEFAULT;
  } catch(e) { return GAS_URL_DEFAULT; }
})();

// ============================================================
// 状態変数
// ============================================================
let selectedPart = null;
let kanno = '完納';
let zaiyoAri = true;
let photos = []; // {dataUrl, size}

// ============================================================
// タブ切り替え
// ============================================================
function showTab(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const idx = ['tab-input','tab-list','tab-cfg'].indexOf(id);
  document.querySelectorAll('.tab')[idx].classList.add('active');
  if (id === 'tab-cfg') loadCfg();
}

// ============================================================
// 品番検索
// ============================================================
const PARTS = window.__PARTS__ || [];

async function loadParts() {
  if (PARTS.length > 0) return;
  // GASから品番リストを取得
  try {
    const res = await fetch(gasUrl + '?action=parts');
    const d = await res.json();
    if (d.ok && Array.isArray(d.parts)) {
      d.parts.forEach(p => PARTS.push(p));
    }
  } catch(e) {}
}

function searchPart(q) {
  const sug = document.getElementById('suggestions');
  if (!q || q.length < 1) { sug.style.display = 'none'; return; }
  const lower = q.toLowerCase();
  const hits = PARTS.filter(p =>
    p[0].toLowerCase().includes(lower) || p[1].toLowerCase().includes(lower)
  ).slice(0, 15);
  if (!hits.length) { sug.style.display = 'none'; return; }
  sug.innerHTML = hits.map(p =>
    `<div class="sug-item" onclick="selectPart('${p[0].replace(/'/g,"\\'")}','${p[1].replace(/'/g,"\\'")}')">
      <span class="sug-no">${p[0]}</span>
      <span class="sug-nm">${p[1]}</span>
    </div>`
  ).join('');
  sug.style.display = 'block';
}

function selectPart(no, nm) {
  selectedPart = {no, nm};
  document.getElementById('part-search').value = no;
  document.getElementById('suggestions').style.display = 'none';
  document.getElementById('sel-no').textContent = no;
  document.getElementById('sel-nm').textContent = nm;
  document.getElementById('sel-box').style.display = 'block';
}

document.addEventListener('click', e => {
  if (!document.getElementById('part-search-wrap').contains(e.target)) {
    document.getElementById('suggestions').style.display = 'none';
  }
});

// ============================================================
// 実績区分 / 材料残
// ============================================================
function setKanno(v) {
  kanno = v;
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  if (v === '完納')    document.getElementById('btn-kanno').classList.add('active');
  if (v === '分納')    document.getElementById('btn-bunno').classList.add('active');
  if (v === '中間実績') document.getElementById('btn-chuukan').classList.add('active');
}

function setZairyo(v) {
  zaiyoAri = v;
  document.getElementById('btn-zairyo-y').className = 'bool-btn' + (v ? ' active-y' : '');
  document.getElementById('btn-zairyo-n').className = 'bool-btn' + (!v ? ' active-n' : '');
}

// ============================================================
// 写真追加（縦向き修正 + 圧縮）
// ============================================================
function addPhotos(input) {
  const files = Array.from(input.files);
  const remaining = 5 - photos.length;
  files.slice(0, remaining).forEach(file => {
    compressWithOrientation(file, 1280, 0.82).then(dataUrl => {
      const size = Math.round(dataUrl.length * 0.75 / 1024);
      photos.push({dataUrl, size, origSize: Math.round(file.size / 1024)});
      renderPhotos();
    });
  });
  input.value = '';
}

// EXIF orientation を読んで正しい向きにしてから圧縮
function compressWithOrientation(file, maxPx, quality) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const buf = e.target.result;
      const orientation = getOrientation(buf);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let w = img.width, h = img.height;

        // 回転後の実際のサイズを決定
        let sw = w, sh = h;
        if ([5,6,7,8].includes(orientation)) { sw = h; sh = w; }

        // maxPxに収まるようスケール
        const scale = Math.min(1, maxPx / Math.max(sw, sh));
        canvas.width  = Math.round(sw * scale);
        canvas.height = Math.round(sh * scale);

        // orientation に応じた transform
        ctx.save();
        switch(orientation) {
          case 2: ctx.transform(-1,0,0,1,canvas.width,0); break;
          case 3: ctx.transform(-1,0,0,-1,canvas.width,canvas.height); break;
          case 4: ctx.transform(1,0,0,-1,0,canvas.height); break;
          case 5: ctx.transform(0,1,1,0,0,0); break;
          case 6: ctx.transform(0,1,-1,0,canvas.height,0); break;
          case 7: ctx.transform(0,-1,-1,0,canvas.height,canvas.width); break;
          case 8: ctx.transform(0,-1,1,0,0,canvas.width); break;
        }
        ctx.drawImage(img, 0, 0, w * scale, h * scale);
        ctx.restore();

        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = URL.createObjectURL(file);
    };
    reader.readAsArrayBuffer(file);
  });
}

// ArrayBufferからEXIF orientationを取得
function getOrientation(buf) {
  const view = new DataView(buf);
  if (view.getUint16(0, false) !== 0xFFD8) return 1;
  const len = view.byteLength;
  let offset = 2;
  while (offset < len) {
    if (view.getUint16(offset, false) !== 0xFFE1) {
      offset += 2 + view.getUint16(offset + 2, false);
      continue;
    }
    if (view.getUint32(offset + 4, false) !== 0x45786966) return 1;
    const little = view.getUint16(offset + 10, false) === 0x4949;
    const tags = view.getUint16(offset + 14, little);
    for (let i = 0; i < tags; i++) {
      if (view.getUint16(offset + 16 + i * 12, little) === 0x0112) {
        return view.getUint16(offset + 24 + i * 12, little);
      }
    }
    return 1;
  }
  return 1;
}

function renderPhotos() {
  const grid = document.getElementById('photo-grid');
  const totalOrig = photos.reduce((s,p) => s + p.origSize, 0);
  const totalComp = photos.reduce((s,p) => s + p.size, 0);

  let html = photos.map((p, i) => `
    <div class="photo-thumb">
      <img src="${p.dataUrl}" alt="写真${i+1}">
      <button class="photo-del" onclick="removePhoto(${i})">×</button>
    </div>`).join('');

  if (photos.length < 5) {
    html += `<div class="photo-add" onclick="document.getElementById('photo-input').click()">
      <span>📷</span>
      <span>写真を追加<br>(${photos.length}/5枚)</span>
    </div>`;
  }
  grid.innerHTML = html;

  const info = document.getElementById('photo-info');
  if (photos.length > 0) {
    info.textContent = `${photos.length}枚　元: ${totalOrig}KB → 圧縮後: ${totalComp}KB`;
  } else {
    info.textContent = '';
  }
}

function removePhoto(i) {
  photos.splice(i, 1);
  renderPhotos();
}

// ============================================================
// 初期値設定
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  // 今日の日付をデフォルト
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth() + 1).padStart(2, '0');
  const d = String(today.getDate()).padStart(2, '0');
  document.getElementById('prod-date').value = `${y}-${m}-${d}`;

  renderPhotos();
  loadParts();
});

// ============================================================
// 送信
// ============================================================
async function submitForm() {
  if (!selectedPart) { alert('部品番号を選択してください'); return; }
  if (!document.getElementById('prod-date').value) { alert('生産日を入力してください'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '⏳ 保存中...';

  const data = {
    date:     document.getElementById('prod-date').value,
    partNo:   selectedPart.no,
    partName: selectedPart.nm,
    operator: document.getElementById('operator').value,
    prod:     document.getElementById('prod-count').value || '0',
    ng:       document.getElementById('ng-count').value || '0',
    kanno:    kanno,
    zairyo:   zaiyoAri ? 'あり' : 'なし',
    memo:     document.getElementById('memo').value,
    images:   photos.map(p => p.dataUrl),
  };

  try {
    const res = await fetch(gasUrl, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'submit', data})
    });
    const json = await res.json();
    if (json.ok) {
      document.getElementById('success-msg').textContent =
        `${json.fileNames || ''}　${json.count || photos.length}枚保存`;
      document.getElementById('form-screen').style.display = 'none';
      document.getElementById('success-screen').style.display = 'block';
    } else {
      alert('エラー: ' + (json.err || '不明'));
      btn.disabled = false;
      btn.innerHTML = '📤 記録を保存する';
    }
  } catch(e) {
    alert('通信エラー: ' + e.message + '\n\nGAS URLを設定タブで確認してください');
    btn.disabled = false;
    btn.innerHTML = '📤 記録を保存する';
  }
}

// ============================================================
// リセット
// ============================================================
function resetForm() {
  selectedPart = null;
  kanno = '完納';
  zaiyoAri = true;
  photos = [];
  document.getElementById('part-search').value = '';
  document.getElementById('sel-box').style.display = 'none';
  document.getElementById('prod-count').value = '';
  document.getElementById('ng-count').value = '';
  document.getElementById('memo').value = '';
  document.getElementById('operator').value = '';
  setKanno('完納');
  setZairyo(true);
  renderPhotos();
  document.getElementById('form-screen').style.display = 'block';
  document.getElementById('success-screen').style.display = 'none';
  const btn = document.getElementById('submit-btn');
  btn.disabled = false;
  btn.innerHTML = '📤 記録を保存する';
  window.scrollTo(0, 0);
}

// ============================================================
// 記録一覧
// ============================================================
async function loadList() {
  const area = document.getElementById('list-area');
  area.innerHTML = '<div class="loading">読み込み中...</div>';
  try {
    const res = await fetch(gasUrl + '?action=list&limit=30');
    const json = await res.json();
    if (!json.ok) { area.innerHTML = '<div class="loading">取得失敗: ' + json.err + '</div>'; return; }
    const rows = json.records;
    if (!rows.length) { area.innerHTML = '<div class="loading">記録がありません</div>'; return; }
    area.innerHTML = rows.map(r => {
      const kanTag = r.kanno === '完納' ? 'tag-kanno' : r.kanno === '分納' ? 'tag-bunno' : 'tag-chuukan';
      const photos = (r.urls || '').split('|').filter(Boolean);
      const photoLinks = photos.map((u, i) =>
        `<a class="rec-photo-link" href="${u}" target="_blank">📄 写真${i+1}</a>`).join('');
      return `<div class="record-item">
        <div class="rec-header"><span class="rec-no">${r.partNo}</span><span class="rec-date">${r.date}</span></div>
        <div class="rec-name">${r.partName}</div>
        <div class="rec-tags">
          <span class="tag ${kanTag}">${r.kanno}</span>
          ${r.zairyo === 'あり' ? '<span class="tag" style="background:#fce4ec;color:#c62828">材料残あり</span>' : ''}
          ${r.prod ? '<span class="tag" style="background:#f3f3f3;color:#555">生産:'+r.prod+'</span>' : ''}
          ${r.ng && r.ng !== '0' ? '<span class="tag" style="background:#ffebee;color:#b71c1c">不良:'+r.ng+'</span>' : ''}
        </div>
        ${r.memo ? `<div style="font-size:12px;color:#666">${r.memo}</div>` : ''}
        <div class="rec-photos">${photoLinks}</div>
      </div>`;
    }).join('');
  } catch(e) {
    area.innerHTML = '<div class="loading">通信エラー: ' + e.message + '</div>';
  }
}

// ============================================================
// 設定
// ============================================================
function loadCfg() {
  document.getElementById('cfg-gas-url').value = gasUrl;
  const isDefault = gasUrl === GAS_URL_DEFAULT;
  const st = document.getElementById('gas-status');
  st.className = 'gas-status ' + (isDefault ? 'gas-ok' : 'gas-ok');
  st.textContent = isDefault ? '✅ デフォルトURLを使用中' : '✅ カスタムURLを使用中';

  document.getElementById('cfg-info').innerHTML =
    `<div>GAS URL: ${gasUrl.substring(0,60)}...</div>`;
}

function saveCfg() {
  const url = document.getElementById('cfg-gas-url').value.trim();
  if (!url.startsWith('https://script.google.com')) {
    alert('GASのURLを正しく入力してください'); return;
  }
  gasUrl = url;
  localStorage.setItem(CFG_KEY, JSON.stringify({gasUrl: url}));
  document.getElementById('gas-status').className = 'gas-status gas-ok';
  document.getElementById('gas-status').textContent = '✅ 保存しました';
  loadParts();
}
</script>
