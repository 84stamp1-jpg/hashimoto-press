<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金型改修計画表</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root{
  --bg:#f0f2f7;--panel:#fff;--panel2:#f7f8fc;--border:#dde1ed;--border2:#c8cede;
  --text:#1a1f36;--text2:#6b7394;--text3:#9aa0bc;
  --accent:#3b6ef8;--accent-bg:#ebf0ff;
  --m:#2563eb;--m-bg:#dbeafe;--m-bd:#93c5fd;
  --n:#ea6c0a;--n-bg:#fff0e0;--n-bd:#fdba74;
  --trial:#059669;--trial-bg:#d1fae5;--trial-bd:#6ee7b7;
  --custom:#7c3aed;--custom-bg:#ede9fe;--custom-bd:#c4b5fd;
  --warn:#d97706;--warn-bg:#fef3c7;
  --danger:#dc2626;--danger-bg:#fee2e2;
  --ok:#16a34a;--ok-bg:#f0fdf4;
  --shadow:0 1px 4px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);
  --shadow-lg:0 4px 20px rgba(0,0,0,.12);
  --r:8px;--font:'Noto Sans JP',sans-serif;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
header{background:var(--panel);border-bottom:1px solid var(--border);padding:0 16px;height:50px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.logo{font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.logo span{color:var(--accent)}
.date-nav{display:flex;align-items:center;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:3px;flex-shrink:0}
.date-btn{padding:4px 8px;border-radius:5px;border:none;background:transparent;cursor:pointer;font-size:11px;color:var(--text2);transition:all .15s;white-space:nowrap;font-family:var(--font)}
.date-btn:hover{background:var(--panel);color:var(--text)}
.date-btn.today{background:var(--accent);color:#fff;font-weight:700}
.nav-arrow{font-size:14px;color:var(--text2);cursor:pointer;padding:3px 6px;border-radius:4px;border:none;background:transparent}
.nav-arrow:hover{background:var(--panel)}
.hdr-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn{font-family:var(--font);font-size:12px;font-weight:500;padding:6px 12px;border-radius:6px;border:none;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 1px 4px rgba(59,110,248,.3)}
.btn-primary:hover{background:#2f5ee0}
.btn-secondary{background:var(--panel);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid #fca5a5}
.btn-sm{padding:4px 9px;font-size:11px}

/* LAYOUT */
.layout{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 50px)}

/* LEFT */
.left{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.ph{padding:9px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;flex-shrink:0;background:var(--panel2)}
.ptitle{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text2);text-transform:uppercase}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;background:var(--accent-bg);color:var(--accent);border:1px solid #c7d7fd}
.badge-warn{background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
.badge-ok{background:var(--ok-bg);color:var(--ok);border-color:#86efac}
.req-list{flex:1;overflow-y:auto;padding:7px}
.req-list::-webkit-scrollbar{width:4px}
.req-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* REQUEST CARD */
.card{background:var(--panel);border:1.5px solid var(--border);border-radius:var(--r);margin-bottom:6px;cursor:pointer;transition:all .15s;overflow:hidden}
.card:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.card.done{opacity:.5}
.card-main{padding:9px 11px}
.ctop{display:flex;align-items:flex-start;gap:6px;margin-bottom:3px}
.cnum{font-family:var(--mono);font-size:9px;color:var(--text3);padding-top:2px;flex-shrink:0}
.ctitle{font-size:13px;font-weight:600;line-height:1.4;flex:1}
.cproc{font-size:10px;color:var(--text2);margin-bottom:4px;padding-left:19px}
.ctags{display:flex;flex-wrap:wrap;gap:3px;padding-left:19px;margin-bottom:5px}
.tag{font-size:10px;font-weight:500;padding:2px 6px;border-radius:4px;background:var(--trial-bg);color:var(--trial);border:1px solid var(--trial-bd)}
.tag-bari{background:var(--warn-bg);color:#92400e;border-color:#fde68a}
.tag-seido{background:var(--accent-bg);color:#1e40af;border-color:#c7d7fd}
.tag-maint{background:var(--ok-bg);color:var(--ok);border-color:#86efac}
.tag-custom{background:var(--custom-bg);color:var(--custom);border-color:var(--custom-bd)}
.cbot{display:flex;align-items:center;gap:7px;padding-left:19px}
.ctime{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent)}
.cdl{font-size:10px;color:var(--text2);margin-left:auto}
.cdl-u{color:var(--danger);font-weight:600}
.cdl-n{color:var(--warn);font-weight:600}

/* CARD DETAIL */
.card-det{border-top:1px solid var(--border);background:#fafbff;padding:9px 11px;display:none}
.card.sel .card-det{display:block}
.det-sec{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:.06em;margin-bottom:6px}
/* 複合改修エリア */
.kubun-area{margin-bottom:8px}
.kubun-line{display:grid;grid-template-columns:1fr auto 60px 20px;gap:4px;align-items:center;margin-bottom:4px}
.kubun-sel{font-family:var(--font);font-size:11px;border:1px solid var(--border);border-radius:4px;padding:3px 5px;background:var(--panel);color:var(--text);outline:none;width:100%}
.kubun-sel:focus{border-color:var(--accent)}
.kcount{font-family:var(--mono);font-size:11px;width:44px;text-align:center;border:1px solid var(--border);border-radius:4px;padding:3px 4px;background:var(--panel);color:var(--text);outline:none}
.kcount:focus{border-color:var(--accent)}
.khours{font-family:var(--mono);font-size:10px;color:var(--text2);text-align:right;width:60px}
.kdel{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:0;line-height:1}
.kdel:hover{color:var(--danger)}
.add-kubun-row{display:flex;gap:5px;margin-bottom:8px}
.add-kubun-btn{font-size:10px;padding:3px 8px;border-radius:4px;border:1.5px dashed var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;font-family:var(--font)}
.add-kubun-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
/* 任意入力 */
.custom-note{width:100%;font-size:11px;border:1px solid var(--border);border-radius:4px;padding:4px 7px;background:var(--panel);color:var(--text);font-family:var(--font);outline:none;margin-bottom:7px;resize:vertical;min-height:32px}
.custom-note:focus{border-color:var(--accent)}
/* 型種別・トライ */
.carry-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.mtype-sel{font-family:var(--font);font-size:11px;border:1px solid var(--border);border-radius:4px;padding:3px 6px;background:var(--panel);color:var(--text);outline:none}
.trial-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tlabel{font-size:11px;color:var(--text2);flex:1}
/* 合計 */
.total-box{display:flex;align-items:center;justify-content:space-between;background:var(--accent-bg);border-radius:5px;padding:5px 9px;margin-bottom:7px}
.total-label{font-size:11px;color:var(--accent);font-weight:700}
.total-val{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent)}
.assign-row{display:flex;gap:5px}
.assign-btn{flex:1;padding:7px;font-size:12px;font-weight:700;border-radius:6px;border:none;cursor:pointer;transition:all .15s;font-family:var(--font)}
.ab-m{background:var(--m-bg);color:var(--m);border:1.5px solid var(--m-bd)}
.ab-m:hover{background:#bfdbfe}
.ab-n{background:var(--n-bg);color:var(--n);border:1.5px solid var(--n-bd)}
.ab-n:hover{background:#fed7aa}

/* MANUAL ADD */
.manual{border-top:1px solid var(--border);padding:8px;flex-shrink:0;background:var(--panel2)}
.mtoggle{width:100%;text-align:center;font-size:11px;color:var(--text2);cursor:pointer;padding:5px;border-radius:5px;background:transparent;border:1.5px dashed var(--border2);transition:all .15s;font-family:var(--font)}
.mtoggle:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.mform{display:none;margin-top:8px}
.mform.open{display:block}
.frow{margin-bottom:5px}
.flabel{font-size:10px;font-weight:600;color:var(--text2);margin-bottom:3px;display:block}
.finput{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--font);font-size:12px;padding:5px 8px;outline:none;transition:border-color .15s}
.finput:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.f2col{display:grid;grid-template-columns:1fr 1fr;gap:5px}

/* RIGHT */
.right{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.gctrl{padding:9px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ginfo{font-size:11px;color:var(--text2)}
.glegend{display:flex;gap:10px;align-items:center;margin-left:auto}
.legitem{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.legdot{width:10px;height:10px;border-radius:3px}

/* GANTT */
.gwrap{flex:1;overflow:auto;padding:12px 14px}
.gwrap::-webkit-scrollbar{height:6px;width:4px}
.gwrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.gcont{min-width:820px}
.ghdr{display:grid;grid-template-columns:72px 1fr;margin-bottom:5px}
.gruler{position:relative;height:20px}
.gtick{position:absolute;top:0;font-family:var(--mono);font-size:10px;color:var(--text3);transform:translateX(-50%);white-space:nowrap}
.grow{display:grid;grid-template-columns:72px 1fr;margin-bottom:6px}
.glabel{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border-radius:6px 0 0 6px;padding:3px;min-height:52px;letter-spacing:.03em}
.lm{background:var(--m-bg);color:var(--m);border:1px solid var(--m-bd);border-right:none}
.ln{background:var(--n-bg);color:var(--n);border:1px solid var(--n-bd);border-right:none}
.gtrack{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:0 6px 6px 0;min-height:52px;box-shadow:var(--shadow)}
.ggrid{position:absolute;inset:0;pointer-events:none}
.gline{position:absolute;top:0;bottom:0;width:1px;background:var(--border)}
.gline.h{background:var(--border2)}
.bzone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(0,0,0,.025) 4px,rgba(0,0,0,.025) 8px);border-left:1px dashed var(--border2);border-right:1px dashed var(--border2);pointer-events:none;z-index:1}

/* GANTT BLOCKS */
.gblock{position:absolute;top:4px;height:calc(100% - 8px);border-radius:5px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;padding:0 6px;overflow:hidden;transition:filter .12s,transform .1s,box-shadow .12s;z-index:2;border:1px solid transparent;min-width:18px}
.gblock:hover{filter:brightness(.9);transform:scaleY(1.04);z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bm{background:var(--m-bg);border-color:var(--m-bd)}
.bn{background:var(--n-bg);border-color:var(--n-bd)}
.btrial{background:var(--trial-bg);border-color:var(--trial-bd)}
.bcustom{background:var(--custom-bg);border-color:var(--custom-bd)}
.blabel{font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.btime{font-family:var(--mono);font-size:8px;white-space:nowrap}
.bm .blabel,.bm .btime{color:var(--m)}
.bn .blabel,.bn .btime{color:var(--n)}
.btrial .blabel,.btrial .btime{color:var(--trial)}
.bcustom .blabel,.bcustom .btime{color:var(--custom)}

/* 実績オーバーレイ（予実） */
.gblock-actual{position:absolute;top:4px;height:calc(100% - 8px);border-radius:5px;z-index:3;pointer-events:none;opacity:.55;border:2px solid transparent}
.actual-m{background:var(--m);border-color:var(--m)}
.actual-n{background:var(--n);border-color:var(--n)}

/* DETAIL PANEL */
.dpanel{border-top:1px solid var(--border);background:var(--panel);padding:9px 14px;flex-shrink:0;max-height:200px;overflow-y:auto}
.dpanel::-webkit-scrollbar{width:4px}
.dpanel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.dphdr{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.dptitle{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:.1em;text-transform:uppercase}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:5px}
.ditem{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;display:flex;align-items:stretch;gap:7px;cursor:pointer;transition:border-color .15s}
.ditem:hover{border-color:var(--accent)}
.dcolor{width:4px;border-radius:2px;flex-shrink:0}
.dinfo{flex:1;min-width:0}
.dname{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.dmeta{font-family:var(--mono);font-size:10px;color:var(--text2);margin-bottom:3px}
/* 予実インジケーター */
.yojitsu{display:flex;align-items:center;gap:5px;margin-bottom:4px;font-size:10px}
.yj-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;position:relative}
.yj-plan{position:absolute;left:0;top:0;height:100%;background:var(--accent-bg);border:1px solid var(--m-bd);border-radius:3px}
.yj-actual{position:absolute;left:0;top:0;height:100%;background:var(--m);border-radius:3px;opacity:.7}
.yj-label{font-family:var(--mono);font-size:9px;color:var(--text2);white-space:nowrap}
.yj-over{color:var(--danger)}
.actual-row{display:flex;gap:4px;align-items:center}
.ainput{font-family:var(--mono);font-size:10px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:3px;padding:2px 5px;width:52px;text-align:center;outline:none}
.ainput:focus{border-color:var(--accent)}
.sbtn{font-size:9px;padding:2px 6px;border-radius:3px;border:none;cursor:pointer;font-family:var(--font);font-weight:700}
.sbtn-s{background:var(--trial-bg);color:var(--trial);border:1px solid var(--trial-bd)}
.sbtn-e{background:var(--danger-bg);color:var(--danger);border:1px solid #fca5a5}
.empty{text-align:center;padding:20px;color:var(--text3);font-size:12px}

/* MODAL */
.moverlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.moverlay.open{display:flex}
.mdlg{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;width:460px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.mdlg::-webkit-scrollbar{width:4px}
.mdlg::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.mtitle{font-size:14px;font-weight:700;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.mfooter{display:flex;gap:7px;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}

/* 予実モーダル専用 */
.yj-section{background:var(--panel2);border-radius:6px;padding:10px 12px;margin-bottom:10px;border:1px solid var(--border)}
.yj-sec-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px}
.yj-times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yj-time-block{background:var(--panel);border-radius:5px;padding:7px 9px;border:1px solid var(--border)}
.yj-time-label{font-size:10px;color:var(--text2);margin-bottom:4px}
.yj-time-val{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)}
.yj-diff{font-size:11px;padding:4px 8px;border-radius:4px;text-align:center;font-weight:600;margin-top:8px}
.yj-diff-ok{background:var(--trial-bg);color:var(--trial)}
.yj-diff-over{background:var(--danger-bg);color:var(--danger)}
.yj-diff-none{background:var(--bg);color:var(--text2)}

/* SOURCE TAG */
.src-tag{font-size:9px;padding:1px 5px;border-radius:3px}
.src-kintone{background:#e0f2fe;color:#0369a1}
.src-manual{background:var(--custom-bg);color:var(--custom)}
.src-sample{background:var(--bg);color:var(--text3)}

.loading{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);padding:20px}
.spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media print{
  body{background:#fff}
  header,.left,.gctrl,.dpanel{display:none!important}
  .layout{grid-template-columns:1fr;height:auto}
  .right{overflow:visible;height:auto}
  .gwrap{overflow:visible;padding:6px}
  .gcont{min-width:unset}
}
</style>
</head>
<body>

<header>
  <div class="logo">⚙ <span>金型</span>改修計画表</div>
  <div class="date-nav" id="dateNav">
    <button class="nav-arrow" onclick="shiftWeek(-1)">‹</button>
    <button class="nav-arrow" onclick="shiftWeek(1)">›</button>
  </div>
  <div class="hdr-right">
    <button class="btn btn-secondary btn-sm" onclick="loadKintone()">🔄 kintone同期</button>
    <button class="btn btn-secondary btn-sm" onclick="autoAll()">⚡ 自動配置</button>
    <button class="btn btn-primary btn-sm" onclick="window.print()">🖨 印刷</button>
  </div>
</header>

<div class="layout">
  <!-- LEFT -->
  <div class="left">
    <div class="ph">
      <span class="ptitle">改修依頼一覧</span>
      <span class="badge" id="bdgU">0件</span>
      <span class="badge badge-warn" id="bdgW" style="display:none">⚠急</span>
      <span class="badge badge-ok"   id="bdgA" style="display:none">✓割付済</span>
    </div>
    <div class="req-list" id="reqList">
      <div class="loading"><div class="spinner"></div>kintoneから取得中...</div>
    </div>
    <div class="manual">
      <button class="mtoggle" onclick="toggleMF()">＋ 任意作業を追加</button>
      <div class="mform" id="mForm">
        <div class="frow"><label class="flabel">品番 / 作業内容</label><input class="finput" id="mName" placeholder="例: ABC-123 バリ取り"/></div>
        <div class="f2col">
          <div class="frow"><label class="flabel">改修区分</label>
            <select class="finput" id="mCat">
              <option value="bari">バリ改修 (3H/箇所)</option>
              <option value="seido">精度調整 (1H/箇所)</option>
              <option value="taikyuu">耐久性不足 (4H)</option>
              <option value="mistake">作業ミス (2H)</option>
              <option value="spare">スペア交換 (0.5H/個)</option>
              <option value="height">ハイト合わせ (4H)</option>
              <option value="maint">定期メンテ</option>
              <option value="custom">任意</option>
            </select></div>
          <div class="frow"><label class="flabel">箇所数/個数</label><input class="finput" id="mUnits" type="number" min="1" max="30" value="1"/></div>
        </div>
        <div class="f2col">
          <div class="frow"><label class="flabel">型種別</label>
            <select class="finput" id="mMold"><option value="single">単発</option><option value="prog">順送(PRG)</option></select></div>
          <div class="frow"><label class="flabel">完了希望日</label><input class="finput" id="mDL" type="date"/></div>
        </div>
        <div class="frow"><label class="flabel">品名（任意）</label><input class="finput" id="mHinmei" placeholder="例: フランジブラケット"/></div>
        <button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="addManual()">追加</button>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">

<script>
// ===== CONFIG =====
const GAS_URL='https://script.google.com/macros/s/AKfycbyVyBCDB--oV8YUQhBIM-PoS9MMkUheYinHAl_GXArNWyoe9JXJG8MR0XVdNrf7SvaPZQ/exec';
const APP_ID=6;
const WORK_START=8*60+10,WORK_END=20*60,TOTAL_MIN=WORK_END-WORK_START;
const BREAKS=[{s:600,e:610},{s:730,e:770},{s:890,e:900},{s:1020,e:1030}];

// ===== 改修区分マスタ =====
const KMAP={
  'バリ改修':'bari','バリ':'bari',
  'シワ':'seido','キレツ':'seido','外観不良':'seido','精度不良':'seido','精度調整':'seido','精度':'seido',
  '耐久性不足':'taikyuu','耐久性':'taikyuu',
  '作業ミス':'mistake',
  'スペア交換':'spare','スペア':'spare',
  'ハイト合わせ':'height','ハイト':'height',
  'スクラップ処理':'scrap','スクラップ':'scrap','シューター作成':'scrap',
  '定期メンテ':'maint','定期':'maint','定期メンテナンス':'maint',
};
const TM={
  bari:   {label:'バリ改修',    hpu:3.0, pu:true},
  seido:  {label:'精度調整',    hpu:1.0, pu:true},
  taikyuu:{label:'耐久性不足',  hpu:4.0, pu:true},
  mistake:{label:'作業ミス',    hpu:2.0, pu:true},
  spare:  {label:'スペア交換',  hpu:0.5, pu:true},   // ← perUnit:true に修正
  height: {label:'ハイト合わせ',hpu:4.0, pu:false},
  scrap:  {label:'スクラップ',  hpu:1.0, pu:true, extra:.5},
  maint:  {label:'定期メンテ',  hs:1.0,  hp:2.0,  isMaint:true},
  custom: {label:'任意',        hpu:1.0, pu:true},
};
// 選択肢リスト（カード内セレクトに使用）
const KUBUN_OPTIONS=[
  {k:'bari',  label:'バリ改修'},
  {k:'seido', label:'精度調整（シワ/キレツ/外観/精度不良）'},
  {k:'taikyuu',label:'耐久性不足'},
  {k:'mistake',label:'作業ミス'},
  {k:'spare', label:'スペア交換'},
  {k:'height',label:'ハイト合わせ'},
  {k:'scrap', label:'スクラップ処理'},
  {k:'maint', label:'定期メンテ'},
  {k:'custom',label:'任意（自由入力）'},
];

function nk(v){return KMAP[v?.trim()]||'custom'}
function tagCls(k){
  const key=nk(k);
  if(key==='bari') return 'tag tag-bari';
  if(['seido','taikyuu','mistake'].includes(key)) return 'tag tag-seido';
  if(key==='maint') return 'tag tag-maint';
  if(key==='custom') return 'tag tag-custom';
  return 'tag';
}

// ===== 工数計算 =====
function calcH(kubunInputs, moldType, trialSteps){
  const carry=moldType==='prog'?1.5:moldType==='none'?0:1.0;
  let work=0;
  (kubunInputs||[]).forEach(ki=>{
    const key=ki.key||nk(ki.name);
    const m=TM[key]||TM.custom;
    const u=Math.max(0,ki.units||0);  // 0を許容
    if(m.isMaint){
      work+=(moldType==='prog'?m.hp:m.hs)*Math.max(1,u);
    } else if(key==='scrap'){
      work+=u>0?m.hpu+(u-1)*m.extra:0;
    } else if(m.pu){
      work+=m.hpu*u;  // 箇所数0なら0H
    } else {
      work+=m.hpu;
    }
  });
  // workが0かつtrialあり→搬入+トライのみ（トライ専用作業）
  const trial=trialSteps<=0?0:1.0+Math.max(0,trialSteps-1)*0.5;
  return Math.round((carry+work+trial)*10)/10;
}
function trialH(s){return s<=0?0:1.0+Math.max(0,s-1)*0.5}
function unitH(ki,moldType){
  const key=ki.key||nk(ki.name);
  const m=TM[key]||TM.custom;
  if(m.isMaint) return moldType==='prog'?m.hp:m.hs;
  return m.hpu;
}

// ===== 状態 =====
let requests=[], tasksByDate={}, selReqId=null, actTaskId=null, editTaskId=null;
let weekStart=getMonday(new Date()), curDate=todayStr();

// ===== 日付ユーティリティ =====
function todayStr(){const d=new Date();return fmt(d)}
function fmt(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function fmtDisp(d){const w=['日','月','火','水','木','金','土'];return`${d.getMonth()+1}/${d.getDate()}(${w[d.getDay()]})`}
function fmtMin(m){return`${p2(Math.floor(m/60))}:${p2(m%60)}`}
function p2(n){return String(n).padStart(2,'0')}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function getMonday(d){const day=d.getDay();const diff=day===0?-6:1-day;const m=new Date(d);m.setDate(d.getDate()+diff);return m}
function minToMs(s){if(!s)return null;const[h,m]=s.split(':').map(Number);return h*60+m}

// ===== 週ナビ =====
function buildDateNav(){
  const nav=document.getElementById('dateNav');
  nav.querySelectorAll('.date-btn').forEach(b=>b.remove());
  const lastArrow=nav.querySelector('.nav-arrow:last-child');
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i);const ds=fmt(d);
    const btn=document.createElement('button');
    btn.className='date-btn'+(ds===curDate?' today':'');
    btn.textContent=fmtDisp(d);
    btn.onclick=()=>{curDate=ds;buildDateNav();renderGantt();renderDetail()};
    nav.insertBefore(btn,lastArrow);
  }
  document.getElementById('dpDate').textContent=curDate;
}
function shiftWeek(dir){weekStart=addDays(weekStart,dir*7);buildDateNav()}

// ===== kintone =====
async function loadKintone(){
  document.getElementById('reqList').innerHTML='<div class="loading"><div class="spinner"></div>kintoneから取得中...</div>';
  // JSONP方式でCORSを回避
  const callbackName = 'kintoneCallback_' + Date.now();
  const q = encodeURIComponent('ステータス in ("依頼書発行","作業着手") order by 日付_0 asc limit 100');
  const url = `${GAS_URL}?app=${APP_ID}&query=${q}&callback=${callbackName}`;

  const timeout = setTimeout(()=>{
    console.log('kintone取得タイムアウト');
    cleanup();
    loadSample();
  }, 15000);

  function cleanup(){
    clearTimeout(timeout);
    delete window[callbackName];
    const s = document.getElementById('jsonp_mold');
    if(s) s.remove();
  }

  window[callbackName] = function(data){
    cleanup();
    if(data.records?.length > 0){
      importKintone(data.records);
    } else {
      console.log('kintone: レコードなし or エラー', data);
      loadSample();
    }
  };

  const script = document.createElement('script');
  script.id = 'jsonp_mold';
  script.src = url;
  script.onerror = ()=>{ cleanup(); loadSample(); };
  document.head.appendChild(script);
}

function importKintone(records){
  // 完了系ステータスをJS側でも除外（kintoneクエリの漏れをカバー）
  records = records.filter(r=>{
    const st = r['ステータス']?.value||'';
    return st==='依頼書発行' || st==='作業着手';
  });
  requests=records.map(r=>{
    const hinban  = r['ルックアップ_1']?.value||'';
    const hinmei  = r['文字列__1行__0']?.value||'';    // 品名
    const client  = r['文字列__1行__1']?.value||'';    // 得意先
    const proc1   = r['ドロップダウン_10']?.value||''; // 工程名1
    const proc2   = r['ドロップダウン_11']?.value||''; // 工程名2
    const kubunRaw= r['複数選択']?.value||[];
    const deadline= r['日付_0']?.value||todayStr();    // 完了希望日
    const status  = r['ステータス']?.value||'';
    const noteRaw = r['文字列__複数行__1']?.value||''; // 改修内容メモ
    // 型種別: ドロップダウンフィールド
    const moldTypeVal = r['ドロップダウン']?.value||'';
    const moldType = moldTypeVal.includes('順送')||moldTypeVal.includes('PRG')?'prog':'single';

    const kubunInputs=kubunRaw.length>0
      ?kubunRaw.map(k=>({name:k,units:1,key:nk(k),customH:''}))
      :[{name:'作業',units:1,key:'custom',customH:''}];
    return{
      id:r.$id?.value||String(Math.random()),
      hinban, hinmei, client,
      process:[proc1,proc2].filter(Boolean).join(' / '),
      kubunInputs, moldType, trialSteps:1,
      hours:calcH(kubunInputs,moldType,1),
      deadline, status, note:noteRaw,
      assigned:false, assignee:null, source:'kintone',
      customMemo:'', extraH:0
    };
  });
  requests.sort((a,b)=>a.deadline.localeCompare(b.deadline));
  renderRequestList();autoArrange(curDate);renderGantt();renderDetail();
}

function loadSample(){
  const t=todayStr(),t1=fmt(addDays(new Date(),1)),t2=fmt(addDays(new Date(),2));
  const base=[
    {id:'1',hinban:'HB-2541',hinmei:'フランジブラケット',process:'プレスA/曲げ',kubunInputs:[{name:'バリ改修',units:2,key:'bari'}],moldType:'single',trialSteps:1,deadline:t,source:'sample'},
    {id:'2',hinban:'HB-1832',hinmei:'サポートプレート',process:'プレスB',kubunInputs:[{name:'精度不良',units:1,key:'seido'}],moldType:'prog',trialSteps:2,deadline:t,source:'sample'},
    {id:'3',hinban:'HC-0921',hinmei:'ブラケットASSY',process:'順送プレス',kubunInputs:[{name:'スペア交換',units:3,key:'spare'},{name:'バリ改修',units:1,key:'bari'}],moldType:'prog',trialSteps:1,deadline:t1,source:'sample'},
    {id:'4',hinban:'HB-3310',hinmei:'ロアーアーム',process:'プレスC',kubunInputs:[{name:'耐久性不足',units:1,key:'taikyuu'}],moldType:'single',trialSteps:1,deadline:t1,source:'sample'},
    {id:'5',hinban:'HD-0112',hinmei:'カバープレート',process:'定期点検',kubunInputs:[{name:'定期メンテ',units:2,key:'maint'}],moldType:'prog',trialSteps:0,deadline:t2,source:'sample'},
  ];
  requests=base.map(r=>({...r,hours:calcH(r.kubunInputs,r.moldType,r.trialSteps),assigned:false,assignee:null,note:''}));
  // 当日納期分を自動割付
  requests.filter(r=>r.deadline===t).forEach((r,i)=>{
    const assignee=i%2===0?'matsumoto':'matsunaga';
    pushTask(r,assignee,t);r.assigned=true;r.assignee=assignee;
  });
  autoArrange(curDate);
  renderRequestList();renderGantt();renderDetail();
}

// ===== 依頼カード描画 =====
function renderRequestList(){
  const today=todayStr();
  const ua=requests.filter(r=>!r.assigned),aa=requests.filter(r=>r.assigned);
  const urg=ua.filter(r=>r.deadline<=today);
  document.getElementById('bdgU').textContent=`${ua.length}件`;
  const bw=document.getElementById('bdgW');
  urg.length?Object.assign(bw,{style:'',textContent:`⚠急 ${urg.length}`}):(bw.style.display='none');
  const ba=document.getElementById('bdgA');
  aa.length?Object.assign(ba,{style:'',textContent:`✓${aa.length}件`}):(ba.style.display='none');

  if(!requests.length){document.getElementById('reqList').innerHTML='<div class="empty">依頼がありません</div>';return}

  document.getElementById('reqList').innerHTML=requests.map(r=>{
    const dl=r.deadline,dlCls=dl<today?'cdl-u':dl===today?'cdl-n':'';
    const tags=(r.kubunInputs||[]).map(ki=>`<span class="${tagCls(ki.name)}">${ki.name}</span>`).join('');
    const src=`<span class="src-tag src-${r.source}">${r.source}</span>`;
    const isSel=selReqId===r.id;
    const amark=r.assigned?`<span class="badge ${r.assignee==='matsumoto'?'':'badge-warn'}" style="margin-left:auto;font-size:9px">${r.assignee==='matsumoto'?'松本':'松永'}</span>`:'';

    // 工数行
    const kRows=(r.kubunInputs||[]).map((ki,idx)=>{
      const uh=unitH(ki,r.moldType);
      const totH=Math.round(uh*(ki.units||1)*10)/10;
      const labelText=TM[ki.key||nk(ki.name)]?.label||ki.name;
      return `<div class="kubun-line">
        <select class="kubun-sel" onchange="updateKubunKey('${r.id}',${idx},this.value)">
          ${KUBUN_OPTIONS.map(o=>`<option value="${o.k}" ${(ki.key||nk(ki.name))===o.k?'selected':''}>${o.label}</option>`).join('')}
        </select>
        <input class="kcount" type="number" min="0" max="30" value="${ki.units||1}"
          onchange="updateKubunUnits('${r.id}',${idx},this.value)"/>
        <span class="khours" id="kh_${r.id}_${idx}">${totH}H</span>
        <button class="kdel" onclick="removeKubun('${r.id}',${idx})">✕</button>
      </div>`;
    }).join('');

    return `<div class="card ${r.assigned?'done':''} ${isSel?'sel':''}" onclick="selReq('${r.id}')">
      <div class="card-main">
        <div class="ctop">
          <span class="cnum">#${r.id}</span>
          <span class="ctitle">${r.hinban}${r.hinmei?' / '+r.hinmei:''}</span>
          ${src}${amark}
        </div>
        ${r.process?`<div class="cproc">${r.process}</div>`:''}
        ${r.client?`<div class="cproc" style="color:var(--accent);font-size:10px">🏭 ${r.client}</div>`:''}
        ${r.status?`<div class="cproc"><span style="font-size:9px;padding:1px 5px;border-radius:3px;background:var(--warn-bg);color:var(--warn);border:1px solid #fde68a">${r.status}</span></div>`:''}
        ${r.note?`<div class="cproc" style="color:var(--text3);font-size:10px">📝 ${r.note.slice(0,45)}${r.note.length>45?'…':''}</div>`:''}
        <div class="ctags">${tags}</div>
        <div class="cbot"><span class="ctime">⏱ ${r.hours}H</span>${dl?`<span class="cdl ${dlCls}">完了希望 ${dl}</span>`:''}</div>
      </div>
      <div class="card-det" onclick="event.stopPropagation()">
        <div class="det-sec">工数積算</div>
        <div class="carry-row">
          <span style="font-size:11px;color:var(--text2)">型種別：</span>
          <select class="mtype-sel" onchange="updateMold('${r.id}',this.value)">
            <option value="none"   ${r.moldType==='none'?'selected':''}>なし（搬入0H）</option>
            <option value="single" ${r.moldType==='single'?'selected':''}>単発（搬入1.0H）</option>
            <option value="prog"   ${r.moldType==='prog'?'selected':''}>順送PRG（搬入1.5H）</option>
          </select>
        </div>
        <div class="kubun-area" id="ka_${r.id}">${kRows}</div>
        <div class="add-kubun-row">
          <button class="add-kubun-btn" onclick="addKubun('${r.id}')">＋ 改修内容を追加</button>
        </div>
        <div class="trial-row">
          <span class="tlabel">トライ工程数：</span>
          <input class="kcount" type="number" min="0" max="5" value="${r.trialSteps||1}"
            onchange="updateTrial('${r.id}',this.value)"/>
          <span class="khours" id="th_${r.id}">${trialH(r.trialSteps||1)}H</span>
        </div>
        <div class="frow">
          <label class="flabel">備考・任意メモ</label>
          <textarea class="custom-note" id="note_${r.id}" placeholder="例: 刃先欠け有り、寸法要確認"
            onchange="updateNote('${r.id}',this.value)">${r.note||''}</textarea>
        </div>
        <div class="total-box">
          <span class="total-label">合計工数</span>
          <span class="total-val" id="tot_${r.id}">${r.hours}H</span>
        </div>
        ${!r.assigned?`<div class="assign-row">
          <button class="assign-btn ab-m" onclick="assignTo('${r.id}','matsumoto')">松本に割付</button>
          <button class="assign-btn ab-n" onclick="assignTo('${r.id}','matsunaga')">松永に割付</button>
        </div>`:`<div style="text-align:center;font-size:11px;color:var(--text2);padding:4px">割付済（ブロックをクリックで編集）</div>`}
      </div>
    </div>`;
  }).join('');
}

function selReq(id){selReqId=selReqId===id?null:id;renderRequestList()}

// ===== 工数更新関数 =====
function updateKubunKey(rid,idx,val){
  const r=requests.find(x=>x.id===rid);if(!r)return;
  r.kubunInputs[idx].key=val;
  r.kubunInputs[idx].name=TM[val]?.label||val;
  refreshH(r);
}
function updateKubunUnits(rid,idx,val){
  const r=requests.find(x=>x.id===rid);if(!r)return;
  r.kubunInputs[idx].units=Math.max(0,parseInt(val)||0);
  refreshH(r);
}
function addKubun(rid){
  const r=requests.find(x=>x.id===rid);if(!r)return;
  r.kubunInputs.push({name:'バリ改修',units:1,key:'bari'});
  refreshH(r);
  renderRequestList();
  // 追加後も展開維持
  selReqId=rid;
  renderRequestList();
}
function removeKubun(rid,idx){
  const r=requests.find(x=>x.id===rid);if(!r)return;
  if(r.kubunInputs.length<=1){alert('最低1つ必要です');return}
  r.kubunInputs.splice(idx,1);
  refreshH(r);renderRequestList();selReqId=rid;renderRequestList();
}
function updateMold(rid,val){const r=requests.find(x=>x.id===rid);if(!r)return;r.moldType=val;refreshH(r)}
function updateTrial(rid,val){
  const r=requests.find(x=>x.id===rid);if(!r)return;
  r.trialSteps=Math.max(0,parseInt(val)||0);
  const el=document.getElementById('th_'+rid);if(el)el.textContent=trialH(r.trialSteps)+'H';
  refreshH(r);
}
function updateNote(rid,val){const r=requests.find(x=>x.id===rid);if(r)r.note=val}
function refreshH(r){
  r.hours=calcH(r.kubunInputs,r.moldType,r.trialSteps);
  const el=document.getElementById('tot_'+r.id);if(el)el.textContent=r.hours+'H';
  // 単位表示更新
  (r.kubunInputs||[]).forEach((ki,idx)=>{
    const uh=unitH(ki,r.moldType);
    const tot=Math.round(uh*(ki.units||1)*10)/10;
    const el2=document.getElementById(`kh_${r.id}_${idx}`);if(el2)el2.textContent=tot+'H';
  });
  // 割付済みなら再配置
  if(r.assigned){
    const tasks=getDate(curDate);
    const t=tasks.find(t=>t.reqId===r.id);
    if(t){t.hours=r.hours;t.trialSteps=r.trialSteps;autoArrange(curDate);renderGantt();renderDetail()}
  }
}

// ===== 割付 =====
function pushTask(r,assignee,dateStr){
  const task={
    id:'t'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    reqId:r.id,
    name:r.hinban+(r.hinmei?' '+r.hinmei:''),
    kubun:r.kubunInputs.map(k=>k.name),
    hours:r.hours,assignee,moldType:r.moldType,
    trialSteps:r.trialSteps,deadline:r.deadline,
    planDate:dateStr,startMin:null,memo:'',
    actual:{start:'',end:'',note:'',pauses:[],pausedAt:null}
  };
  if(!tasksByDate[dateStr])tasksByDate[dateStr]=[];
  tasksByDate[dateStr].push(task);
  return task;
}
function assignTo(rid,assignee){
  const r=requests.find(x=>x.id===rid);if(!r||r.assigned)return;
  pushTask(r,assignee,curDate);
  r.assigned=true;r.assignee=assignee;
  autoArrange(curDate);saveTasks();selReqId=null;
  renderRequestList();renderGantt();renderDetail();
}
function autoAll(){
  const ua=requests.filter(r=>!r.assigned);
  if(!ua.length){alert('未割付の依頼がありません');return}
  ua.forEach((r,i)=>{
    const a=i%2===0?'matsumoto':'matsunaga';
    pushTask(r,a,curDate);r.assigned=true;r.assignee=a;
  });
  autoArrange(curDate);saveTasks();renderRequestList();renderGantt();renderDetail();
}

// ===== 時間計算 =====
function nextAvail(m){
  let v=Math.max(m,WORK_START);
  for(const b of BREAKS){if(v>=b.s&&v<b.e)v=b.e}return v;
}
function addWork(start,workMin){
  let cur=start,rem=workMin;
  while(rem>0){
    let nb=WORK_END;
    for(const b of BREAKS){if(b.s>cur){nb=Math.min(nb,b.s);break}}
    const av=nb-cur;
    if(av>=rem){cur+=rem;rem=0}
    else{rem-=av;cur=nb;for(const b of BREAKS){if(b.s===cur){cur=b.e;break}}}
  }
  return cur;
}
function autoArrange(ds){
  const tasks=getDate(ds);
  ['matsumoto','matsunaga'].forEach(a=>{
    let cur=WORK_START;
    tasks.filter(t=>t.assignee===a).forEach(t=>{
      cur=nextAvail(cur);t.startMin=cur;
      cur=addWork(cur,Math.round(t.hours*60));
    });
  });
}
function getDate(ds){return tasksByDate[ds]||[]}

// ===== ガント描画 =====
function renderGantt(){
  const cont=document.getElementById('gcont');
  const wrap=cont.parentElement;
  const tw=Math.max(600,wrap.getBoundingClientRect().width-72-28-20);
  const mx=m=>(Math.max(0,m-WORK_START)/TOTAL_MIN)*tw;
  const dw=(s,e)=>Math.max(4,mx(e)-mx(s));

  const ticks=[];
  for(let h=8;h<=20;h++){const m=h*60;if(m<WORK_START||m>WORK_END)continue;ticks.push(`<div class="gtick" style="left:${mx(m)}px">${p2(h)}:00</div>`)}

  const glines=[];
  for(let h=8;h<=20;h++){const m=h*60;if(m<WORK_START||m>WORK_END)continue;glines.push(`<div class="gline h" style="left:${mx(m)}px"></div>`)}
  const bzs=BREAKS.map(b=>`<div class="bzone" style="left:${mx(b.s)}px;width:${dw(b.s,b.e)}px"></div>`).join('');
  const grid=`<div class="ggrid">${glines.join('')}${bzs}</div>`;

  const tasks=getDate(curDate);

  const rows=['matsumoto','matsunaga'].map(a=>{
    const lbl=a==='matsumoto'?'松本':'松永';
    const lc=a==='matsumoto'?'lm':'ln';
    const myTasks=tasks.filter(t=>t.assignee===a);

    const blocks=myTasks.flatMap(t=>{
      if(t.startMin===null)return[];
      const repMin=Math.round((t.hours-trialH(t.trialSteps))*60);
      const repEnd=addWork(t.startMin,repMin);
      const trialEnd=addWork(repEnd,Math.round(trialH(t.trialSteps)*60));
      const bc=a==='matsumoto'?'bm':'bn';

      const rx=mx(t.startMin),rw=dw(t.startMin,repEnd);
      const res=[`<div class="gblock ${bc}" style="left:${rx}px;width:${rw}px"
        onclick="openActModal('${t.id}')" title="${t.name}">
        <div class="blabel">${t.name}</div>
        <div class="btime">${fmtMin(t.startMin)}〜${fmtMin(repEnd)}</div>
      </div>`];

      if(t.trialSteps>0&&trialEnd>repEnd){
        const tx=mx(repEnd),ttw=dw(repEnd,trialEnd);
        res.push(`<div class="gblock btrial" style="left:${tx}px;width:${ttw}px"
          onclick="openActModal('${t.id}')" title="${t.name} トライ">
          <div class="blabel">▶トライ</div>
          <div class="btime">${fmtMin(repEnd)}〜${fmtMin(trialEnd)}</div>
        </div>`);
      }

      // 実績オーバーレイ
      const as=minToMs(t.actual.start),ae=minToMs(t.actual.end);
      if(as!==null&&ae!==null&&ae>as){
        const ox=mx(as),ow=dw(as,ae);
        const oc=a==='matsumoto'?'actual-m':'actual-n';
        res.push(`<div class="gblock-actual ${oc}" style="left:${ox}px;width:${ow}px" title="実績: ${t.actual.start}〜${t.actual.end}"></div>`);
      }
      return res;
    });

    return`<div class="grow">
      <div class="glabel ${lc}">${lbl}</div>
      <div class="gtrack" style="width:${tw}px">${grid}${blocks.join('')}</div>
    </div>`;
  }).join('');

  cont.innerHTML=`<div class="ghdr"><div></div><div class="gruler" style="width:${tw}px">${ticks.join('')}</div></div>${rows}`;
}

// ===== 予実パネル =====
function renderDetail(){
  const tasks=getDate(curDate);
  const grid=document.getElementById('dgrid');
  if(!tasks.length){grid.innerHTML='<div class="empty">作業を割付けると表示されます</div>';return}

  grid.innerHTML=tasks.map(t=>{
    const color=t.assignee==='matsumoto'?'var(--m)':'var(--n)';
    const planEndMin=t.startMin!=null?addWork(t.startMin,Math.round(t.hours*60)):null;
    const tr=t.startMin!=null?`${fmtMin(t.startMin)}〜${fmtMin(planEndMin)}`:'未配置';
    const planMinutes=t.startMin!=null?Math.round(t.hours*60):null;

    // 予実バー
    const as=minToMs(t.actual.start),ae=minToMs(t.actual.end);
    let yjHtml='';
    if(planMinutes&&as!==null){
      const actMin=ae!==null?(ae-as):(new Date().getHours()*60+new Date().getMinutes()-as);
      const pct=Math.min(100,Math.round((actMin/planMinutes)*100));
      const over=ae!==null&&actMin>planMinutes;
      yjHtml=`<div class="yojitsu">
        <div class="yj-bar">
          <div class="yj-plan" style="width:100%"></div>
          <div class="yj-actual" style="width:${pct}%;background:${over?'var(--danger)':'var(--m)'}"></div>
        </div>
        <span class="yj-label ${over?'yj-over':''}">${pct}%</span>
      </div>`;
    }

    return`<div class="ditem" onclick="openActModal('${t.id}')">
      <div class="dcolor" style="background:${color}"></div>
      <div class="dinfo">
        <div class="dname">${t.name}</div>
        <div class="dmeta">${tr} / ${t.hours}H</div>
        ${yjHtml}
        <div class="actual-row" onclick="event.stopPropagation()">
          <input class="ainput" id="as_${t.id}" placeholder="開始" value="${t.actual.start}"
            onchange="setAct('${t.id}','start',this.value)"/>
          <button class="sbtn sbtn-s" onclick="stampNow('${t.id}','start')">▶</button>
          <input class="ainput" id="ae_${t.id}" placeholder="終了" value="${t.actual.end}"
            onchange="setAct('${t.id}','end',this.value)"/>
          <button class="sbtn sbtn-e" onclick="stampNow('${t.id}','end')">■</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function stampNow(id,type){
  const t=getDate(curDate).find(x=>x.id===id);if(!t)return;
  const n=new Date();const v=`${p2(n.getHours())}:${p2(n.getMinutes())}`;
  t.actual[type]=v;
  const el=document.getElementById((type==='start'?'as_':'ae_')+id);
  if(el)el.value=v;
  renderGantt();renderDetail();
}
function setAct(id,type,val){
  const t=getDate(curDate).find(x=>x.id===id);if(t){t.actual[type]=val;renderGantt();renderDetail()}
}

// ===== 実績モーダル =====
function openActModal(id){
  const t=getDate(curDate).find(x=>x.id===id);if(!t)return;
  actTaskId=id;
  document.getElementById('actTitle').textContent=t.name;
  const planEndMin=t.startMin!=null?addWork(t.startMin,Math.round(t.hours*60)):null;
  document.getElementById('planStart').textContent=t.startMin!=null?fmtMin(t.startMin):'—';
  document.getElementById('planEnd').textContent=planEndMin!=null?fmtMin(planEndMin):'—';
  document.getElementById('actStart2').textContent=t.actual.start||'未記録';
  document.getElementById('actEnd2').textContent=t.actual.end||'未記録';
  document.getElementById('inActS').value=t.actual.start||'';
  document.getElementById('inActE').value=t.actual.end||'';
  document.getElementById('inActNote').value=t.actual.note||'';
  updateYjDiff(t);
  // 一時停止UI初期化
  renderPauseLog(t);
  const isPaused = !!t.actual.pausedAt;
  document.getElementById('pauseBtn').textContent = isPaused ? '▶ 再開' : '⏸ 一時停止';
  document.getElementById('pauseBtn').style.background = isPaused ? 'var(--trial-bg)' : '';
  document.getElementById('pauseStatus').textContent = isPaused ? `一時停止中 (${t.actual.pausedAt})` : '';
  document.getElementById('actModal').classList.add('open');
}
function updateYjDiff(t){
  const as=minToMs(t.actual.start),ae=minToMs(t.actual.end);
  const planEndMin=t.startMin!=null?addWork(t.startMin,Math.round(t.hours*60)):null;
  const el=document.getElementById('yjDiff');
  if(as===null||ae===null||t.startMin===null){el.className='yj-diff yj-diff-none';el.textContent='実績を入力すると差異が表示されます';return}
  const planMin=planEndMin-t.startMin;const actMin=ae-as;
  const diff=actMin-planMin;
  if(diff>0){el.className='yj-diff yj-diff-over';el.textContent=`⚠ 計画より ${Math.abs(diff)}分 超過（計画${planMin}分→実績${actMin}分）`}
  else if(diff<0){el.className='yj-diff yj-diff-ok';el.textContent=`✓ 計画より ${Math.abs(diff)}分 早く完了（計画${planMin}分→実績${actMin}分）`}
  else{el.className='yj-diff yj-diff-ok';el.textContent='✓ 計画通り完了'}
}
function stampNowModal(type){
  const n=new Date();const v=`${p2(n.getHours())}:${p2(n.getMinutes())}`;
  document.getElementById(type==='start'?'inActS':'inActE').value=v;
  // リアルタイム差異更新
  const t=getDate(curDate).find(x=>x.id===actTaskId);
  if(t){t.actual[type]=v;updateYjDiff(t)}
}
function togglePause(){
  const t=getDate(curDate).find(x=>x.id===actTaskId);if(!t)return;
  const now=new Date();
  const v=`${p2(now.getHours())}:${p2(now.getMinutes())}`;
  if(!t.actual.pauses) t.actual.pauses=[];
  if(t.actual.pausedAt){
    // 再開
    t.actual.pauses.push({from:t.actual.pausedAt, to:v});
    t.actual.pausedAt=null;
    document.getElementById('pauseBtn').textContent='⏸ 一時停止';
    document.getElementById('pauseBtn').style.background='';
    document.getElementById('pauseStatus').textContent='';
  } else {
    // 一時停止
    t.actual.pausedAt=v;
    document.getElementById('pauseBtn').textContent='▶ 再開';
    document.getElementById('pauseBtn').style.background='var(--trial-bg)';
    document.getElementById('pauseStatus').textContent=`一時停止中 (${v})`;
  }
  renderPauseLog(t);
  saveTasks();
}
function renderPauseLog(t){
  const pauses=t.actual.pauses||[];
  const logEl=document.getElementById('pauseLog');
  const totalEl=document.getElementById('pauseTotalRow');
  if(!pauses.length){
    logEl.textContent='一時停止の記録なし';
    totalEl.style.display='none';
    return;
  }
  let totalMin=0;
  logEl.innerHTML=pauses.map((p,i)=>{
    const fm=minToMs(p.from),tm=minToMs(p.to);
    const dur=fm!=null&&tm!=null?tm-fm:0;
    totalMin+=dur;
    return `${i+1}. ${p.from}〜${p.to}（${dur}分）`;
  }).join('<br>');
  totalEl.style.display='block';
  totalEl.textContent=`合計停止時間: ${totalMin}分（実作業から除外してください）`;
}
function saveActual(){
  const t=getDate(curDate).find(x=>x.id===actTaskId);if(!t)return;
  t.actual.start=document.getElementById('inActS').value;
  t.actual.end=document.getElementById('inActE').value;
  t.actual.note=document.getElementById('inActNote').value;
  saveTasks();closeActModal();renderGantt();renderDetail();
}
function closeActModal(){document.getElementById('actModal').classList.remove('open');actTaskId=null}
function openEditFromAct(){
  const id=actTaskId;closeActModal();
  const t=getDate(curDate).find(x=>x.id===id);if(!t)return;
  editTaskId=id;
  document.getElementById('editTitle').textContent='工数編集: '+t.name;

  document.getElementById('eAssign').value=t.assignee;
  document.getElementById('eMemo').value=t.memo||'';
  document.getElementById('editModal').classList.add('open');
}
function deleteTaskModal(){
  if(!actTaskId)return;
  const t=getDate(curDate).find(x=>x.id===actTaskId);
  if(t){
    const r=requests.find(x=>x.id===t.reqId);
    if(r){r.assigned=false;r.assignee=null}
    tasksByDate[curDate]=(tasksByDate[curDate]||[]).filter(x=>x.id!==actTaskId);
  saveTasks();
    autoArrange(curDate);
  }
  closeActModal();renderRequestList();renderGantt();renderDetail();
}
function saveEdit(){
  if(!editTaskId)return;
  const t=getDate(curDate).find(x=>x.id===editTaskId);if(!t)return;
  t.name=document.getElementById('eName').value;
  t.kubun=document.getElementById('eCat').value.split(/[,、]/).map(s=>s.trim()).filter(Boolean);

  autoArrange(curDate);saveTasks();closeEditModal();renderGantt();renderDetail();

function closeEditModal(){document.getElementById('editModal').classList.remove('open');editTaskId=null}

// ===== 手動追加 =====
function toggleMF(){document.getElementById('mForm').classList.toggle('open')}
function addManual(){
  const name=document.getElementById('mName').value.trim();
  if(!name){alert('品番/作業内容を入力してください');return}

// ===== localStorage 保存・読み込み =====
const STORAGE_KEY = 'moldRepairPlan_tasks';

function saveTasks(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasksByDate));
  }catch(e){ console.log('save error:',e); }
}

function loadSavedTasks(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      // 今日以降のデータのみ復元
      const today = todayStr();
      Object.keys(parsed).forEach(ds=>{
        if(ds >= today) tasksByDate[ds] = parsed[ds];
      });
      console.log('計画を復元しました');
    }
  }catch(e){ console.log('load error:',e); }
}

function clearSavedTasks(){
  if(confirm('保存された計画を全てクリアしますか？')){
    localStorage.removeItem(STORAGE_KEY);
    tasksByDate={};
    renderReqList();renderGantt();
    alert('クリアしました');
  }
}

requestAnimationFrame(()=>{
  buildDateNav();
  loadSavedTasks();  // 保存済み計画を先に復元
  loadKintone();     // その後kintoneからデータ取得
});
