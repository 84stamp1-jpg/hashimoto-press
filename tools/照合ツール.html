<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>調達基準表 照合ツール｜橋本工業</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --bg:#f0f2f7;--surface:#fff;--surface2:#f5f7fb;--border:#dde1ec;
  --accent:#2563eb;--accent2:#7c3aed;--ok:#16a34a;--warn:#d97706;
  --ng:#dc2626;--text:#1e2235;--text2:#4b5580;--text3:#9099bb;--header:#1e2235;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
header{background:var(--header);padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#3b82f6,#7c3aed);border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px;color:#fff;flex-shrink:0}
header h1{font-size:14px;font-weight:500;color:#fff;letter-spacing:.04em}
header small{font-size:11px;color:#8893bb;margin-left:2px}
.hstats{margin-left:auto;display:flex;gap:24px;font-size:11px;color:#8893bb}
.hstats b{color:#e2e8f0;font-weight:500;font-family:'IBM Plex Mono',monospace}
.main{padding:20px 28px;max-width:1400px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ptitle{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
.drop{border:1.5px dashed var(--border);border-radius:8px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface2);position:relative}
.drop:hover,.drop.over{border-color:var(--accent);background:#eff6ff}
.drop.loaded{border-color:var(--ok);background:#f0fdf4}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop .ico{font-size:28px;margin-bottom:8px;display:block}
.drop p{color:var(--text2);font-size:13px;margin-bottom:3px}
.drop .hint{font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace}
.ctrl{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;font-weight:500}
.field select,.field input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 11px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;outline:none;transition:border-color .2s}
.field select:focus,.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn{padding:8px 18px;border-radius:6px;border:none;font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.bp{background:var(--accent);color:#fff}.bp:hover{background:#1d4ed8;transform:translateY(-1px)}.bp:disabled{background:#93c5fd;cursor:not-allowed;transform:none}
.bs{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}.bs:hover{border-color:var(--accent);color:var(--accent)}
.pbar{height:3px;background:var(--border);border-radius:2px;margin-top:10px;display:none;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .3s;width:0%}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.clbl{font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;font-weight:600}
.cval{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:500;line-height:1}
.c-ok{color:var(--ok)}.c-w{color:var(--warn)}.c-ng{color:var(--ng)}.c-bl{color:var(--accent)}
.fbar{display:flex;gap:7px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.fb{padding:5px 13px;border-radius:16px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:11px;cursor:pointer;transition:all .15s;font-family:'Noto Sans JP',sans-serif;font-weight:500}
.fb:hover{border-color:var(--accent);color:var(--accent)}
.f-all{background:var(--accent);border-color:var(--accent);color:#fff}
.f-ng{background:var(--ng);border-color:var(--ng);color:#fff}
.f-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.f-ms{background:var(--warn);border-color:var(--warn);color:#fff}
.f-pdf{background:var(--accent2);border-color:var(--accent2);color:#fff}
.srch{margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:5px 14px;color:var(--text);font-size:11px;outline:none;width:220px;transition:border-color .2s;font-family:'Noto Sans JP',sans-serif}
.srch:focus{border-color:var(--accent)}
.tw{background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--surface2);border-bottom:2px solid var(--border)}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:#f8f9ff}
tbody tr.pm{background:#faf5ff}
tbody tr:last-child{border-bottom:none}
td{padding:8px 12px;font-size:12px;vertical-align:middle}
td.r{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px}
td.mn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text2)}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:600}
.bok{background:#dcfce7;color:var(--ok)}.bng{background:#fee2e2;color:var(--ng)}.bms{background:#ede9fe;color:var(--accent2)}
.dp{color:var(--ng);font-weight:500}.dn{color:var(--accent2);font-weight:500}.dz{color:var(--ok)}
.note{font-size:10px;color:var(--text3);font-style:italic}
#status{font-size:12px;color:var(--text2);padding:8px 0 0;min-height:20px}
.obar{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.main{padding:14px}}
</style>
</head>
<body>
<header>
  <div class="logo">HK</div>
  <div><h1>調達基準表 照合ツール</h1><small>橋本工業株式会社 ／ ユタカ技研向け</small></div>
  <div class="hstats" id="hstats" style="display:none">
    <div>照合 <b id="hm">0</b> 件</div>
    <div>差異 <b id="hd">0</b> 件</div>
    <div><b id="ht">-</b></div>
  </div>
</header>
<div class="main">
  <div class="panel">
    <div class="ptitle">① 調達基準表 PDF をアップロード</div>
    <div class="drop" id="drop">
      <input type="file" accept=".pdf" id="fi">
      <span class="ico" id="ico">📄</span>
      <p id="ft">クリックまたはドラッグ＆ドロップ</p>
      <p class="hint" id="fh">部品単価通知書 兼 調達基準表 PDF</p>
    </div>
    <div class="pbar" id="pbar"><div class="pfill" id="pf"></div></div>
    <div class="ctrl">
      <div class="field"><label>照合対象</label>
        <select id="pt"><option value="no_mold">型レス単価</option><option value="with_mold">型込み単価</option></select>
      </div>
      <div class="field"><label>許容差異（円）</label>
        <input type="number" id="tol" value="0.5" step="0.1" min="0" style="width:90px">
      </div>
      <button class="btn bp" id="run" disabled>▶ 照合実行</button>
      <button class="btn bs" id="rst">リセット</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="result" style="display:none">
    <div class="cards" id="cards"></div>
    <div class="fbar">
      <button class="fb f-all" data-f="all"     onclick="setF(this,'all')">すべて</button>
      <button class="fb"       data-f="ng"      onclick="setF(this,'ng')">⚠ 差異あり</button>
      <button class="fb"       data-f="ok"      onclick="setF(this,'ok')">✓ 一致</button>
      <button class="fb"       data-f="missing" onclick="setF(this,'missing')">PDF未記載</button>
      <button class="fb"       data-f="pdf_only" onclick="setF(this,'pdf_only')">📄 今回PDF品番のみ</button>
      <input class="srch" id="sq" placeholder="品番・部品名で検索..." oninput="render()">
    </div>
    <div class="tw">
      <table>
        <thead><tr>
          <th>調達NO</th><th>品番</th><th>部品名</th><th>客先管理NO</th>
          <th class="r">適用年月日</th>
          <th class="r">PDF 加工単価</th><th class="r">Excel 計算値</th>
          <th class="r">差異</th><th class="r">差異率</th><th>判定</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="obar"><button class="btn bs" onclick="expCSV()">📥 CSV 出力</button></div>
  </div>
</div>

function loadF(f){
  pdfFile=f;
  document.getElementById('ico').textContent='✅';
  document.getElementById('ft').textContent=f.name;
  document.getElementById('fh').textContent=(f.size/1024).toFixed(0)+' KB';
  drop.classList.add('loaded');
  document.getElementById('run').disabled=false;
  setSt('PDF読み込み完了。「照合実行」を押してください。');
}

async function parsePDF(file){
  const buf=await file.arrayBuffer();
  if(!window.pdfjsLib){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res();};
      s.onerror=rej; document.head.appendChild(s);
    });
  }
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  const results=[];
  for(let p=1;p<=pdf.numPages;p++){
    document.getElementById('pf').style.width=(p/pdf.numPages*80+10)+'%';
    const page=await pdf.getPage(p);
    const vp=page.getViewport({scale:1.0});
    const tc=await page.getTextContent();
    const spans=[];
    for(const item of tc.items){
      const t=item.str.trim();
      if(!t) continue;
      spans.push({x:Math.round(item.transform[4]), y:Math.round(vp.height-item.transform[5]), text:t});
    }
    for(const sp of spans){
      if(sp.x>=130&&sp.x<=330&&sp.y>=95&&sp.y<=175&&/^1[0-9A-Z]{3,4}-[A-Z0-9]{2}/.test(sp.text)){
        let price=null;
        for(const s2 of spans){
          if(Math.abs(s2.y-sp.y)<=6&&s2.x>=660&&s2.x<=800){
            const v=parseFloat(s2.text.replace(/,/g,''));
            if(!isNaN(v)&&v>5){price=v;break;}
          }
        }
        if(price!==null) results.push({part_no:sp.text.trim(),price});
      }
    }
  }
  return results;
}

// 品番マッチング：完全一致 → 前方一致（短い方が長い方の前方に含まれる）
function norm(s){return String(s).replace(/[\s\u3000]+/g,'').toUpperCase();}

function matchPartNo(pdfKey, excelKey){
  if(pdfKey===excelKey) return 'exact';
  // 末尾の数字部分が省略/違う場合を吸収（例: -000 vs -0002, -0102 vs -0100/0101/102）
  // どちらかが他方の前方一致
  const shorter = pdfKey.length < excelKey.length ? pdfKey : excelKey;
  const longer  = pdfKey.length < excelKey.length ? excelKey : pdfKey;
  if(longer.startsWith(shorter)) return 'prefix';
  // ハイフン区切りで主要部分一致（最初の2セグメント）
  const seg = s => s.split('-').slice(0,3).join('-');
  if(seg(pdfKey)===seg(excelKey)) return 'seg';
  return null;
}

document.getElementById('run').addEventListener('click',async()=>{
  if(!pdfFile)return;
  const btn=document.getElementById('run');
  btn.disabled=true;btn.textContent='⏳ 処理中...';
  document.getElementById('pbar').style.display='block';
  document.getElementById('pf').style.width='5%';
  try{
    setSt('PDFを解析中...');
    const pdfList=await parsePDF(pdfFile);
    setSt(`PDF解析完了：${pdfList.length}件検出。照合中...`);
    buildResults(pdfList,document.getElementById('pt').value,parseFloat(document.getElementById('tol').value)||0);
    document.getElementById('pf').style.width='100%';
    setTimeout(()=>{document.getElementById('pbar').style.display='none';},400);
    document.getElementById('hstats').style.display='flex';
    document.getElementById('ht').textContent=new Date().toLocaleTimeString('ja-JP');
  }catch(e){setSt('❌ エラー: '+e.message);console.error(e);}
  btn.disabled=false;btn.innerHTML='▶ 照合実行';
});

function buildResults(pdfList,ptype,tol){
  // PDFマップ（正規化キー）
  const pdfMap={};
  pdfKeys=new Set();
  for(const item of pdfList){
    const k=norm(item.part_no);
    pdfKeys.add(k);
    if(!pdfMap[k]) pdfMap[k]=[];
    pdfMap[k].push(item);
  }

  for(const item of ED){
    const ep=ptype==='with_mold'?item.excel_with_mold:item.excel_no_mold;
    if(!ep) continue;
    const ek=norm(item.part_no);

    // 1. 完全一致
    let found=pdfMap[ek];
    let matchType='exact';

    // 2. 前方一致・セグメント一致
    if(!found){
      for(const pk of pdfKeys){
        const mt=matchPartNo(pk,ek);
        if(mt){found=pdfMap[pk];matchType=mt;break;}
      }
    }

    let pdfPrice=null,diff=null,dr=null,status='missing';

      dr=ep?parseFloat((diff/ep*100).toFixed(2)):null;
      nMt++;
      if(Math.abs(diff)<=tol){status='ok';nOk++;}else{status='ng';nNg++;}
    }else{nMs++;}

    rows.push({
      no:item.no,part_no:item.part_no,part_name:item.part_name,
      mgmt_nos:item.mgmt_nos||[],appl_date:item.appl_date||'',
      pdf_price:pdfPrice,excel_price:ep,diff,diff_rate:dr,status,
      in_pdf:found!=null,match_type:matchType
    });
  }

  allRows=rows;
  document.getElementById('hm').textContent=nMt;
  document.getElementById('hd').textContent=nNg;
  document.getElementById('cards').innerHTML=`
    <div class="card"><div class="clbl">PDF照合件数</div><div class="cval c-bl">${nMt}</div></div>
    <div class="card"><div class="clbl">✓ 一致</div><div class="cval c-ok">${nOk}</div></div>
    <div class="card"><div class="clbl">⚠ 差異あり</div><div class="cval c-ng">${nNg}</div></div>
    <div class="card"><div class="clbl">PDF未記載</div><div class="cval c-w">${nMs}</div></div>`;
  document.getElementById('result').style.display='block';
  curF='all';
  document.querySelectorAll('.fb').forEach(b=>b.className='fb');
  document.querySelector('[data-f="all"]').classList.add('f-all');
  render();
  setSt(`照合完了：${nMt}件照合 ／ 差異あり ${nNg}件 ／ PDF未記載 ${nMs}件`);
}

function render(){
  const q=document.getElementById('sq').value.toLowerCase();
  const rows=allRows.filter(r=>{
    if(curF==='pdf_only') return r.in_pdf;
    if(curF!=='all'&&r.status!==curF) return false;
    return !q||(r.part_no+' '+r.part_name).toLowerCase().includes(q);
  });
  const tb=document.getElementById('tbody');
  if(!rows.length){tb.innerHTML='<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--text3)">該当なし</td></tr>';return;}
  tb.innerHTML=rows.map(r=>{
    const pv=r.pdf_price!=null?r.pdf_price.toFixed(2):'—';
    const ev=r.excel_price.toFixed(2);
    let dh='—',rh='—';
    if(r.diff!=null){
      const c=r.diff>0?'dp':r.diff<0?'dn':'dz';
      const sg=r.diff>0?'+':'';
      dh=`<span class="${c}">${sg}${r.diff.toFixed(2)}</span>`;
      if(r.diff_rate!=null)rh=`<span class="${c}">${r.diff_rate>0?'+':''}${r.diff_rate.toFixed(1)}%</span>`;
    }
    const badge=r.status==='ok'?'<span class="badge bok">✓ 一致</span>'
               :r.status==='ng'?'<span class="badge bng">⚠ 差異</span>'
               :'<span class="badge bms">未記載</span>';
    const note=r.match_type&&r.match_type!=='exact'?`<br><span class="note">(前方一致)</span>`:'';
    const mgmt=r.mgmt_nos.length?r.mgmt_nos.join('<br>'):'—';
    return `<tr class="${r.in_pdf?'pm':''}">
      <td class="mn">${r.no}</td>
      <td class="mn">${r.part_no}${note}</td>
      <td style="max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.part_name}">${r.part_name}</td>
      <td class="mn" style="font-size:10px;line-height:1.7">${mgmt}</td>
      <td class="r mn" style="font-size:11px">${r.appl_date}</td>
      <td class="r">${pv}</td><td class="r">${ev}</td>
      <td class="r">${dh}</td><td class="r">${rh}</td><td>${badge}</td>
    </tr>`;
  }).join('');
}

function setF(btn,f){
  curF=f;
  document.querySelectorAll('.fb').forEach(b=>b.className='fb');
  btn.classList.add(f==='all'?'f-all':f==='ng'?'f-ng':f==='ok'?'f-ok':f==='pdf_only'?'f-pdf':'f-ms');
  render();
}

function expCSV(){
  const lbl=document.getElementById('pt').value==='with_mold'?'型込み':'型レス';
  const rows=[['調達NO','品番','部品名','客先管理NO','適用年月日','PDF加工単価',`Excel計算値(${lbl})`,'差異','差異率','判定']];
  for(const r of allRows) rows.push([r.no,r.part_no,r.part_name,r.mgmt_nos.join(' '),r.appl_date,
    r.pdf_price!=null?r.pdf_price.toFixed(2):'',r.excel_price.toFixed(2),
    r.diff!=null?r.diff.toFixed(2):'',r.diff_rate!=null?r.diff_rate.toFixed(1)+'%':'',
    r.status==='ok'?'一致':r.status==='ng'?'差異あり':'PDF未記載']);
  const bom='\uFEFF',csv=bom+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`照合結果_${new Date().toLocaleDateString('ja-JP').replace(/\//g,'')}.csv`;
  a.click();
}

document.getElementById('rst').addEventListener('click',()=>{
  pdfFile=null;document.getElementById('fi').value='';
  drop.classList.remove('loaded');
  document.getElementById('ico').textContent='📄';
  document.getElementById('ft').textContent='クリックまたはドラッグ＆ドロップ';
  document.getElementById('fh').textContent='部品単価通知書 兼 調達基準表 PDF';
  document.getElementById('run').disabled=true;
  document.getElementById('result').style.display='none';
  document.getElementById('hstats').style.display='none';
  document.getElementById('pbar').style.display='none';
  allRows=[];pdfKeys=new Set();setSt('');
});

function setSt(m){document.getElementById('status').textContent=m;}
</script>
